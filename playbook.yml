---
- name: Administrar servidores Linux en Docker con Ansible
  hosts: docker
  tasks:
    - name: Mostrar el nombre del host
      debug:
        msg: "Nombre del host: {{ ansible_hostname }}"

    - name: Mostrar el sistema operativo
      debug:
        msg: "Sistema operativo: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Crear el directorio /tmp/ansible-demo
      file:
        path: /tmp/ansible-demo
        state: directory
        mode: '0755'

    - name: Crear archivo info.txt con el nombre del servidor y sistema operativo
      copy:
        dest: /tmp/ansible-demo/info.txt
        content: |
          Servidor: {{ ansible_hostname }}
          Sistema Operativo: {{ ansible_distribution }} {{ ansible_distribution_version }}

    - name: Crear directorios logs, backup y config mediante un loop
      file:
        path: "/tmp/ansible-demo/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - logs
        - backup
        - config

    - name: Mostrar mensaje únicamente cuando el sistema operativo sea Ubuntu
      debug:
        msg: "Confirmado: {{ inventory_hostname }} está ejecutando Ubuntu."
      when: ansible_distribution == "Ubuntu"
